project:
  name: ragtree
  seed: 42
  log_dir: logs

paths:
  data_raw: data/raw
  data_preprocessed: data/preprocessed
  data_processed: data/processed
  kg: data/kg
  ontology: data/ontology
  results: results
  jsonresults: jsonresults
  models: models

datasets:
  raw:                       # folders you already have
    CausalBank:      data/raw/CausalBank
    DocRED:          data/raw/DocRED/DocRED
    EventStoryLine:  data/raw/EventStoryLine/EventStoryLine_master
    FinCausal:       data/raw/FinCausal/data
    MAVEN_ERE:       data/raw/MAVEN_ERE

  preprocessed:              # normalized JSONL targets
    causalbank:     data/preprocessed/causalbank.jsonl
    docred_causal:  data/preprocessed/docred_causal.jsonl
    eventstoryline: data/preprocessed/eventstoryline.jsonl
    fincausal:      data/preprocessed/fincausal.jsonl
    maven_ere:      data/preprocessed/maven_ere.jsonl

rag:
  retrieval_k: 5
  strategy: flat

llm:
  agentic_hybrid:
    default_backend: vllm
    system_prompt_key: agentic_hybrid_docre
    backends:
      vllm:
        model: "openai/gpt-oss-20b"
        temperature: 0.0
        max_tokens: 1024
        base_url: "http://localhost:8000"
        api_key: "dummy"

      ollama:
        model: "qwen2.5:7b"
        temperature: 0.0
        max_tokens: 1024

      openrouter:
        model: "gpt-4.1-mini"
        temperature: 0.0
        max_tokens: 1024


  kg_rag:
    default_backend: "vllm"

    backends:
      vllm:
        model: "openai/gpt-oss-20b"
        temperature: 0.0
        max_tokens: 1024
        base_url: "http://localhost:8000"
        api_key: "dummy"

      ollama:
        model: "qwen2.5:7b"
        temperature: 0.0
        max_tokens: 1024

      openrouter:
        model: "gpt-4.1-mini"
        temperature: 0.0
        max_tokens: 1024

    system_prompt_key: "kg_rag_docre"

  growlrag:
    default_backend: "openrouter"

    backends:
      vllm:
        model: "openai/gpt-oss-20b"
        temperature: 0.0
        max_tokens: 1024
        base_url: "http://localhost:8000"
        api_key: "dummy"

      ollama:
        model: "qwen2.5:7b"
        temperature: 0.0
        max_tokens: 1024

      openrouter:
        model: "gpt-4.1-mini"
        temperature: 0.0
        max_tokens: 1024

    system_prompt_key: "growlrag_docre"

  cot:
    default_backend: "vllm"

    backends:
      vllm:
        model: "openai/gpt-oss-20b"
        temperature: 0.0
        max_tokens: 512
        base_url: "http://localhost:8000"
        api_key: "dummy"

      ollama:
        model: "qwen2.5:3b"
        temperature: 0.0
        max_tokens: 512

      openrouter:
        model: "gpt-4.1-mini"
        temperature: 0.0
        max_tokens: 512

    system_prompt_key: "causal_relations"
  icl:
    default_backend: "vllm"

    backends:
      vllm:
        model: "openai/gpt-oss-20b"
        temperature: 0.0
        max_tokens: 512
        base_url: "http://localhost:8000"
        api_key: "dummy"

      ollama:
        model: "qwen2.5:3b"
        temperature: 0.0
        max_tokens: 512

      openrouter:
        model: "gpt-4.1-mini"
        temperature: 0.0
        max_tokens: 512

    system_prompt_key: "causal_relations"

  baseline:
    default_backend: "vllm"

    backends:
      vllm:
        model: "openai/gpt-oss-20b"
        temperature: 0.0
        max_tokens: 512
        base_url: "http://localhost:8000"
        api_key: "dummy"

      ollama:
        model: "qwen2.5:3b"
        temperature: 0.0
        max_tokens: 512

      openrouter:
        model: "gpt-4.1-mini"
        temperature: 0.0
        max_tokens: 512

    system_prompt_key: "causal_relations"

prompts:
  baseline:
    causal_relations: |
      You are an expert at extracting RELATIONS between entities.
      ...
      You must output ONLY valid JSON with this exact structure:
      {
        "<RELATION_TYPE_1>": [["EVENT_x", "EVENT_y"], ...],
        "<RELATION_TYPE_2>": [],
        ...
      }
      ...

  growlrag:
    growlrag_docre: |
      You are an expert at document-level relation extraction for knowledge graph construction.

      You will be given:
      - A document (title + sentences)
      - A list of entities with IDs and mentions (token spans)
      - Optional ontology links per entity (classes/datatypes)
      - A retrieved ontology fragment (classes + properties + domain/range constraints)

      Task:
      1) Extract binary relations between the provided entity IDs ONLY.
      2) Use ONLY the relation types provided (the keys of the relation schema).
      3) Prefer relations that satisfy ontology constraints (domain/range compatibility).

      Output format (JSON only):
      {
        "<RELATION_TYPE_1>": [["ENTITY_ID_A", "ENTITY_ID_B"], ...],
        "<RELATION_TYPE_2>": [],
        ...
      }

      Rules:
      - Do NOT invent new relation types.
      - Do NOT output any text outside the JSON.

  kg_rag:
    kg_rag_docre: |
      You are an expert at document-level relation extraction.

      You will be given:
      - A document (title + sentences or text)
      - A list of entities with canonical IDs
      - A retrieved KG context (triples / paths / subgraph)

      Task:
      1) Extract relations ONLY between the PROVIDED entity IDs.
      2) Output keys MUST match the allowed relation types exactly.
      3) Output JSON only. No extra text.

      Output format:
      {
        "<RELATION_TYPE_1>": [["ENTITY_ID_A","ENTITY_ID_B"], ...],
        "<RELATION_TYPE_2>": [],
        ...
      }
  
  agentic_hybrid:
    agentic_hybrid_docre: |
      You are an expert at document-level relation extraction.
      You MUST output ONLY valid JSON (no markdown, no explanations).
      You MUST use ONLY the PROVIDED entity IDs in output pairs.
      Output keys MUST match the allowed relation types exactly.
      Values MUST be lists of [HEAD_ID, TAIL_ID] pairs.
      If unsure, output empty lists for those relation types.

ontology:
  causalbank:    data/ontology/COInd4/ContextOntology-COInd4.ttl
  EventKG: data/ontology/EventKG/EventKGSchema.ttl
  fibocore:     data/ontology/FIBO-Core/fibo-core.ttl
  fibocoreplus:     data/ontology/FIBO-CorePlus/fibo-core-plus.ttl
  framenet: data/ontology/framenet/framenet.ttl
  owltime: data/ontology/OWLTime/time.ttl
  propbank: data/ontology/PropBank/propbank.ttl
  verbbank: data/ontology/VerbNet/verbnet.ttl
  wordnet: data/ontology/WordNet/wnfull.ttl
  wordnetsynset: data/ontology/Wordnet-Synset/wordnet-synset.ttl
  wordnetfull: data/ontology/WordNet-Full/wordnet.ttl
  docredontology: data/ontology/DocREDOntology/ontology.ttl
  
ontology_linking:
  default_method: llm_embedding

  output:
    # Only the folder is configured here.
    # The code will generate the output filename from the input JSONL filename
    # + the chosen method + ontology key + versioning if needed.
    folder: data/preprocessed
    write_field: "ontology_links"
    overwrite: true

  defaults:
    top_k: 3
    min_score: 0.3

  methods:
    llm_embedding:
      kind: embedding
      backend: ollama
      top_k: 3
      min_score: 0.3

    growlrag_minilm:
      kind: embedding_st
      model: "all-MiniLM-L6-v2"
      top_k: 3
      min_score: 0.3


growlrag:
  ontology_key: docredontology
  linking_method: llm_embedding

  retrieval:
    mode: domain_range_filter
    include_unrestricted_properties: true
    max_properties: 120
    max_classes: 200

  few_shot:
    k: 0
