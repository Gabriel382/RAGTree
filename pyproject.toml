[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtree"
version = "0.1.0-alpha.0"
description = "A bring-your-own-stack framework for Semantic RAG over complex documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Gabriel Henrique Alencar Medeiros" }
]
keywords = [
  "rag",
  "semantic-rag",
  "llm",
  "retrieval",
  "knowledge-graph",
  "ontology",
  "evaluation",
  "document-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "rapidfuzz>=3.9",
  "tqdm>=4.66",
  "requests>=2.32",
  "rich>=13.7",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Gabriel382/RAGTree"
Repository = "https://github.com/Gabriel382/RAGTree"
Issues = "https://github.com/Gabriel382/RAGTree/issues"

[project.optional-dependencies]
llm-openai = ["openai>=1.40"]
llm-ollama = ["ollama>=0.3.0"]
llm-litellm = ["litellm>=1.44"]
embeddings = [
  "sentence-transformers>=3.0",
  "torch>=2.2; platform_system != 'Windows' or platform_machine != 'ARM64'",
]
vector-faiss = ["faiss-cpu>=1.8.0.post1"]
vector-chroma = ["chromadb>=0.5"]
vector-qdrant = ["qdrant-client>=1.9"]
vector-elastic = ["elasticsearch>=8.13"]
graph = ["networkx>=3.2"]
neo4j = ["neo4j>=5.20"]
rdf = [
  "rdflib>=7.0",
  "owlready2>=0.47",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
ui = [
  "streamlit>=1.35",
  "plotly>=5.22",
]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.8",
]
ops = [
  "docker>=7.0",
  "gunicorn>=22.0",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
all = [
  "openai>=1.40",
  "ollama>=0.3.0",
  "litellm>=1.44",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8.0.post1",
  "chromadb>=0.5",
  "qdrant-client>=1.9",
  "elasticsearch>=8.13",
  "networkx>=3.2",
  "neo4j>=5.20",
  "rdflib>=7.0",
  "owlready2>=0.47",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.35",
  "plotly>=5.22",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.8",
  "docker>=7.0",
  "gunicorn>=22.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
ragtree = "ragtree.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragtree*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings"
testpaths = ["tests"]
markers = [
  "integration: tests requiring external services",
  "api: tests requiring FastAPI extras",
  "ui: tests requiring Streamlit extras",
  "neo4j: tests requiring Neo4j",
  "docker: tests requiring Docker",
]
