name: tests

on:
  push:
  pull_request:

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Check CLI
        run: ragtree doctor
      - name: Run tests
        run: pytest -m "not integration"
      - name: Lint
        run: ruff check ragtree scripts tests || true
