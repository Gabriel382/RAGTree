name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Check CLI
        run: ragtree doctor
      - name: Run unit, contract and e2e tests
        run: pytest tests/unit tests/contract tests/e2e
      - name: Run demo example
        run: python examples/semantic_rag_demo.py
      - name: Lint core and tests (strict)
        run: ruff check src/ragtree/core src/ragtree/cli src/ragtree/tasks src/ragtree/retrieval src/ragtree/generation src/ragtree/integrations tests
      - name: Lint research layers (advisory)
        run: ruff check src scripts || true

  integration-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with light integration extras
        run: pip install -e ".[dev,vector-qdrant,rdf]"
      - name: Run integration tests (qdrant in-process, rdflib)
        run: pytest tests/integration -m integration
