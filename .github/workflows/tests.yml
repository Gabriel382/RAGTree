name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Check CLI
        run: ragtree doctor
      - name: Run unit and contract tests
        run: pytest tests/unit tests/contract
      - name: Lint core and tests (strict)
        run: ruff check src/ragtree/core src/ragtree/cli tests
      - name: Lint research layers (advisory)
        run: ruff check src scripts || true
